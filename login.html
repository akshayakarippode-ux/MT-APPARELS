<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MT APPARELS Customer Portal. Log in to manage custom production runs, view mockups, track orders, and request quotes.">
    <title>Customer Login | MT APPARELS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            
            <a href="index.html" class="auth-logo" aria-label="Go back to MT APPARELS landing page">
                <img src="assets/logo_mark.png" alt="MT APPARELS Icon" class="logo-img">
                <span>MT APPARELS</span>
            </a>

            <div class="auth-header">
                <h1 class="auth-title">Customer Login</h1>
                <p class="auth-subtitle">Log in to track designs and production runs.</p>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email" class="form-label">Email Address *</label>
                    <input type="email" id="login-email" class="form-control" placeholder="client@company.com" required>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="login-password" class="form-label">Password *</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required>
                        <button type="button" class="password-toggle" id="password-toggle-btn" aria-label="Show password">
                            <!-- Eye icon -->
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="auth-options">
                    <label class="checkbox-container">
                        Remember me
                        <input type="checkbox" id="login-remember">
                        <span class="checkmark"></span>
                    </label>
                    <a href="#" class="auth-link" id="forgot-password-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary auth-submit-btn">Login to Account</button>
                
                <div class="form-feedback" id="login-feedback"></div>
            </form>

            <div class="auth-footer">
                <p>New to MT APPARELS? <a href="register.html" class="auth-link">Create an account</a></p>
                <p style="margin-top: 1.5rem; font-size: 0.85rem;"><a href="index.html" class="auth-link">&larr; Back to Main Website</a></p>
            </div>

        </div>
    </div>

    <!-- JavaScript interactions -->
    <script src="script.js"></script>
</body>
</html>
